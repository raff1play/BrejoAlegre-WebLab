<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101b27" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Laboratório visual 3D de direção — Brejo Alegre Delivery Simulator. Protótipo web fictício e experimental." />
    <title>Brejo Alegre — Web Lab</title>
  </head>
  <body>
    <canvas id="renderCanvas" aria-label="Mundo 3D de teste"></canvas>
    <div id="hud" class="hud">
      <div class="brand"><span class="brand-mark">◈</span> BREJO ALEGRE <small id="version">WEB LAB</small></div>
      <div class="prototype-label" role="note">ÁREA TEMPORÁRIA DE TESTE — NÃO REPRESENTA BREJO ALEGRE</div>
      <div class="telemetry"><strong id="speed">0</strong> <span>km/h</span></div>
      <div class="status-panel">
        <strong id="mode">Pilotando</strong>
        <span id="tips"></span>
        <span class="status-line"><span id="fps">— FPS</span>
          <button type="button" data-action="graphics" class="link" aria-label="Alternar perfil gráfico">Gráficos</button></span>
        <span class="keys">Q/E girar · Z/X zoom · arrastar gira a câmera</span>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div class="pad pad-left" aria-label="Direção">
        <button type="button" data-control="left" aria-label="Esquerda">◀</button>
        <button type="button" data-control="right" aria-label="Direita">▶</button>
      </div>
      <div class="pad pad-right" aria-label="Aceleração">
        <button type="button" data-action="mount" class="primary wide">Descer</button>
        <button type="button" data-control="brake" aria-label="Frear ou ré">▼<small>FREIO</small></button>
        <button type="button" data-control="accelerate" aria-label="Acelerar">▲<small>ACELERAR</small></button>
      </div>
      <nav class="camera-bar" aria-label="Câmera">
        <button type="button" data-control="camera-left" aria-label="Girar câmera à esquerda">↶</button>
        <button type="button" data-control="zoom-out" aria-label="Afastar câmera">－</button>
        <button type="button" data-control="zoom-in" aria-label="Aproximar câmera">＋</button>
        <button type="button" data-control="camera-right" aria-label="Girar câmera à direita">↷</button>
      </nav>
    </div>
    <div id="fatal" class="fatal" role="alert" hidden></div>
    <div class="portrait-warning" role="status">Gire o celular para jogar na horizontal.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
