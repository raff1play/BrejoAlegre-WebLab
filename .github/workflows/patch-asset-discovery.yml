name: Patch asset discovery (one-time)
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/patch-asset-discovery.yml']
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install patch CLI
        run: npm install --global --no-audit --no-fund @patchgg/cli
      - name: List CLI commands
        run: |
          pch --help | head -70
          pch assets --help | head -90
      - name: Search realistic city buses
        continue-on-error: true
        run: |
          pch assets search "city bus" | head -140
          pch assets search "urban bus" | head -100
      - name: Search animated civilian characters
        continue-on-error: true
        run: |
          pch assets search "animated woman" | head -140
          pch assets search "civilian human" | head -110
      - name: Search optimized bus and pedestrian models
        continue-on-error: true
        run: |
          pch assets search "bus" | head -150
          pch assets search "pedestrian" | head -130
      - name: Inspect and search citizen models
        run: |
          pch assets search --type model "worker" | head -140
          pch assets search --type model "person" | head -120
          pch assets search --type model "woman" | head -130
          pch assets search --type model "man" | head -130
          pch assets search --type model "character" | head -100
          pch assets view "polyfork:city-bus-49fd97"
          pch assets view "anymove:woman"
          pch assets add --help | head -120
      - name: Preview candidate thumbnails for visual gate
        run: |
          python3 - <<'PY'
          import urllib.request,base64
          urls={
            'city_bus':'https://assets.patchusercontent.com/sha256/40b4c37a04ab54085b3b70376958bc2e467dd51a96f28d08f998cd3955991e10/thumbnail.png',
            'woman':'https://assets.patchusercontent.com/sha256/41748a09329d31408763bdb9d051ccd2084fee75e8faba9e4b81e68e0f5ba45c/thumbnail.png',
            'worker':'https://assets.patchusercontent.com/sha256/35769b6fbde6eada887d10db8870d7f0b5ed42363fdd5fea24f2bf5304649c37/thumbnail.png',
            'mpfb_man':'https://assets.patchusercontent.com/sha256/d3643e465c847f0ea1a33b2f13112c53c02aede8286ecf2b2ef2797d8a9b97d4/thumbnail.png'
          }
          for name,url in urls.items():
            try:
              data=urllib.request.urlopen(url,timeout=15).read()
              print(f'IMG_{name}='+base64.b64encode(data).decode())
            except Exception as e: print('IMGERROR_'+name+': '+str(e))
          PY
      - name: Download selected GLBs into isolated scratch dir
        continue-on-error: true
        run: |
          mkdir -p /tmp/patch-pilot
          cd /tmp/patch-pilot
          pch assets add --to /tmp/patch-pilot/import polyfork:city-bus-49fd97 anymove:woman mpfb:human-0192
          find /tmp/patch-pilot -type f -printf '%p %s bytes\\n' | head -70
          python3 - <<'PY'
          import json,struct,pathlib
          for p in pathlib.Path('/tmp/patch-pilot').rglob('*.glb'):
            data=p.read_bytes()
            magic,version,length=struct.unpack_from('<III',data)
            jlen,jtyp=struct.unpack_from('<II',data,12)
            doc=json.loads(data[20:20+jlen])
            print('GLB',p,'version',version,'bytes',length,'meshes',len(doc.get('meshes',[])),'animations',[a.get('name') for a in doc.get('animations',[])],'skins',len(doc.get('skins',[])),'nodes',len(doc.get('nodes',[])))
          PY
