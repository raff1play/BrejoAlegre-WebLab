name: Dados OSM - recorte de Brejo Alegre (execucao manual/isolada)

# CORE-015: o proxy da sessao de desenvolvimento bloqueia o Overpass; este job roda num runner do
# GitHub, baixa SOMENTE o recorte da sede urbana (±2 km) e grava data/osm/ na preview.
# Nao publica nada: o deploy continua restrito a docs/PREVIEW_DEPLOY_TRIGGER.md.
on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

concurrency:
  group: osm-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baixar recorte OSM (Overpass)
        run: node scripts/geo/fetch-osm.mjs
      - name: Conferir tamanho do recorte
        run: |
          ls -la data/osm
          size=$(stat -c %s data/osm/brejo-alegre.raw.json)
          test "$size" -lt 20000000
      - name: Gravar dados na preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git commit -m "data(osm): recorte OpenStreetMap da sede de Brejo Alegre (ODbL, © OpenStreetMap contributors)" || exit 0
          git pull --rebase origin preview
          git push origin HEAD:preview
