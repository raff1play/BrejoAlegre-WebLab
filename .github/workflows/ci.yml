name: CI - validar prototype
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'setup/**', 'docs/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Starter has no lockfile because npm registry was unreachable during preparation.
      # First successful npm install MUST commit package-lock.json and switch this to npm ci.
      - name: Install (temporary until lockfile exists)
        run: npm install --no-audit --no-fund
      - run: npm run validate:repo
      - run: npm run test:unit
      - run: npm run build:staging
      - name: Stage-only build artifact (never deploy from CI)
        uses: actions/upload-artifact@v4
        with:
          name: weblab-staging-${{ github.sha }}
          path: dist/
          if-no-files-found: error
