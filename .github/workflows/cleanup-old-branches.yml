name: One-time removal of obsolete branches
on:
  push:
    branches: [preview]
    paths: ['.github/workflows/cleanup-old-branches.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'raff1play/BrejoAlegre-WebLab' && github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only 5 explicitly approved old branches
        uses: actions/github-script@v7
        with:
          script: |
            // Approved in chat on 2026-11-12: keep main + preview only.
            // Refuse to delete a branch if its HEAD changed since verification.
            const expected = [
              ['feat/weblab-core-w009', '1c90232fd761585b0e5b94c5e78f1c26c97d622f'],
              ['feat/core-010-visual-remaster', '6cf7e792a8536087c842f8f82db9f761669a9219'],
              ['feat/core-011-real-assets', '261e7fba7faa3cc96f3c423da60381d7bee9ac07'],
              ['feat/core-012-gta-camera', 'bf8881e514e7f6e6a451a299de262197ef1e1271'],
              ['setup/weblab-foundation', '44168136a3a08804ad47d59271c884471b75f78a'],
            ];
            const { owner, repo } = context.repo;
            const keep = new Set(['main', 'preview']);
            for (const [name, expectedSha] of expected) {
              if (keep.has(name)) throw new Error('Refusing to delete protected branch ' + name);
              const ref = 'heads/' + name;
              const { data: current } = await github.rest.git.getRef({ owner, repo, ref });
              if (current.object.sha !== expectedSha) {
                throw new Error('Branch changed since review: ' + name + ' at ' + current.object.sha);
              }
              await github.rest.git.deleteRef({ owner, repo, ref });
              core.info('Deleted obsolete branch: ' + name);
            }
            const { data: branches } = await github.rest.repos.listBranches({ owner, repo, per_page: 100 });
            const actual = branches.map(({ name }) => name).sort();
            const wanted = ['main', 'preview'];
            if (JSON.stringify(actual) !== JSON.stringify(wanted)) {
              throw new Error('Unexpected branches remaining: ' + JSON.stringify(actual));
            }
            core.info('Verified only main and preview remain.');
