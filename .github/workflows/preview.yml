name: Preview - Pages (publicacao autorizada)

# Edicoes de codigo nao publicam automaticamente.
# Somente o arquivo de autorizacao dispara o deploy da branch preview.
on:
  push:
    branches:
      - preview
    paths:
      - docs/PREVIEW_DEPLOY_TRIGGER.md

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-weblab-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Validate repository
        run: npm run validate:repo
      - name: Unit tests
        run: npm run test:unit
      - name: Build preview
        run: npm run build:staging
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy preview
        id: deploy
        uses: actions/deploy-pages@v4
