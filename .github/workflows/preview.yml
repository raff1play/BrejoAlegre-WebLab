name: Preview - Pages (CI + browser antes de publicar)

# B1-00: publicar somente mudancas do JOGO na preview e apenas depois de testes.
# Atualizacoes de documentacao ou do estado de aprovacao nao trocam o site.
# main continua com publicacao separada e manual (pages.yml).
on:
  push:
    branches:
      - preview
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'docs/PREVIEW_DEPLOY_TRIGGER.md' # gatilho legado manual continua disponivel

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-weblab-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias reproduziveis
        run: npm ci --no-audit --no-fund
      - name: Validacao de estrutura e manifesto Beta
        run: npm run validate:repo
      - name: Testes unitarios
        run: npm run test:unit
      - name: Build de staging (inclui TypeScript)
        run: npm run build:staging
      - name: Instalar Playwright somente no runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
      - name: Chromium e bibliotecas do runner
        run: npx playwright install --with-deps chromium
      - name: Testes de navegador com trafego ligado
        run: npm run test:e2e
        env:
          CI: true
      - name: Impedir deploy antigo se o codigo do jogo mudou
        run: |
          git fetch origin preview
          if test "$(git rev-parse HEAD)" = "$(git rev-parse origin/preview)"; then exit 0; fi
          if git diff --quiet HEAD origin/preview -- src public index.html package.json package-lock.json vite.config.ts; then
            echo "Commits posteriores sao apenas de documentacao/estado; bundle do jogo permanece valido"
          else
            echo "Existe uma atualizacao posterior de jogo; deploy antigo bloqueado"
            exit 1
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar artefato estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar preview
        id: deploy
        uses: actions/deploy-pages@v4
